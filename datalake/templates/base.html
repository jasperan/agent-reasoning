<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title | default("Datalake") }} - Reasoning Datalake</title>
    <style>
        /* ================================================================
           Reasoning Datalake — a lab logbook under a desk lamp.
           Ink-tinted neutral ramp, one amber highlight, graphite mono.
           ================================================================ */

        :root {
            /* neutral ramp, ink tinted */
            --bg-primary:    #0e1013;
            --bg-secondary:  #14171c;
            --bg-card:       #14171c;
            --bg-hover:      #1a1e24;
            --border:        rgba(232, 234, 237, 0.10);
            --border-light:  rgba(232, 234, 237, 0.07);
            --text-primary:  #e8eaed;
            --text-secondary:#a6adb8;
            --text-muted:    #7c8491;

            /* one accent, plus two semantic tones */
            --accent:        #e0a253;
            --accent-dim:    rgba(224, 162, 83, 0.12);
            --positive:      #4cc38a;
            --negative:      #e5484d;

            --font-mono:     'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --sidebar-width: 240px;

            /* 4px scale */
            --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            font-size: 14px;
            line-height: 1.5;
            font-variant-numeric: tabular-nums;
        }

        /* ---- Sidebar ---- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-header {
            padding: var(--s5) var(--s5) var(--s4);
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-header h1 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .sidebar-header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: var(--s1);
        }

        .sidebar-nav {
            flex: 1;
            padding: var(--s3) 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            height: 32px;
            padding: 0 var(--s5);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            border-left: 2px solid transparent;
            transition: background-color 120ms ease, color 120ms ease;
        }

        .sidebar-nav a:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .sidebar-nav a.active {
            color: var(--text-primary);
            background: rgba(224, 162, 83, 0.07);
            border-left-color: var(--accent);
        }

        .sidebar-footer {
            padding: var(--s4) var(--s5);
            border-top: 1px solid var(--border-light);
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* ---- Main Content ---- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            padding: var(--s5) var(--s6);
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-primary);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--s4);
        }

        .page-header h2 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .page-body {
            padding: var(--s5) var(--s6) var(--s6);
            flex: 1;
        }

        /* ---- Cards ---- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: var(--s5);
            margin-bottom: var(--s5);
        }

        .card:last-child { margin-bottom: 0; }

        .card-header {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--s3);
        }

        /* ---- Stat row: inline figures, hairline dividers ---- */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: var(--s4) var(--s5);
            margin-bottom: var(--s5);
        }

        .stat {
            padding-right: var(--s5);
            margin-right: var(--s5);
            border-right: 1px solid var(--border-light);
        }

        .stat:last-child { border-right: none; padding-right: 0; margin-right: 0; }

        .stat-value {
            font-size: 24px;
            font-weight: 500;
            font-family: var(--font-mono);
            color: var(--text-primary);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: var(--s1);
        }

        .stat.is-positive .stat-value { color: var(--positive); }
        .stat.is-negative .stat-value { color: var(--negative); }

        .stats-row.plain {
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
            margin: 0;
        }

        /* ---- Tables ---- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            text-align: left;
            padding: var(--s3) var(--s3);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody td {
            padding: var(--s3);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            vertical-align: top;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover {
            background: var(--bg-hover);
        }

        .mono {
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .seq {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .text-muted { color: var(--text-muted); }
        .text-secondary { color: var(--text-secondary); }
        .text-right { text-align: right; }
        .text-nowrap { white-space: nowrap; }

        /* ---- Status ---- */
        .status {
            display: inline-flex;
            align-items: center;
            gap: var(--s2);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-completed::before { background: var(--positive); }
        .status-failed::before    { background: var(--negative); }
        .status-running::before   { background: var(--accent); }
        .status-cancelled::before { background: var(--text-muted); }

        /* ---- Strategy / field chips ---- */
        .chip {
            display: inline-block;
            padding: 2px var(--s2);
            border-radius: 4px;
            font-size: 12px;
            background: #1c2027;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* ---- Links ---- */
        a.link {
            color: var(--accent);
            text-decoration: none;
        }

        a.link:hover {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ---- Buttons ---- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--s2);
            height: 32px;
            padding: 0 var(--s4);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 400;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            font-family: var(--font-sans);
            transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
        }

        .btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #14171c;
        }

        .btn-primary:hover {
            background: #eab268;
            border-color: #eab268;
            color: #14171c;
        }

        .btn-sm {
            height: 24px;
            padding: 0 var(--s2);
            font-size: 12px;
        }

        /* ---- Filters ---- */
        .filter-bar {
            display: flex;
            gap: var(--s3);
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: var(--s4);
        }

        .filter-bar select,
        .filter-bar input[type="text"],
        .trace-input {
            height: 32px;
            padding: 0 var(--s3);
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-sans);
        }

        .filter-bar select:focus,
        .filter-bar input:focus,
        .trace-input:focus {
            outline: 1px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        .trace-input { flex: 1; font-family: var(--font-mono); }
        .search-input { width: 200px; }

        /* ---- JSON Block ---- */
        .json-block {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: var(--s3) var(--s4);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ---- Timeline: one vertical rule, a dot per event ---- */
        .timeline {
            position: relative;
            padding-left: var(--s5);
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: var(--s2);
            bottom: var(--s2);
            width: 1px;
            background: rgba(232, 234, 237, 0.16);
        }

        .timeline-event {
            position: relative;
            padding: var(--s3) 0;
            border-bottom: 1px solid var(--border-light);
        }

        .timeline-event:last-child { border-bottom: none; }

        .timeline-event::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 19px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--text-muted);
        }

        .timeline-event.is-update::before { border-color: var(--accent); }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--s3);
            cursor: pointer;
        }

        .event-head-left {
            display: flex;
            align-items: center;
            gap: var(--s3);
            min-width: 0;
        }

        .event-type {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-primary);
            min-width: 88px;
        }

        .event-seq {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .event-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .event-update {
            font-size: 11px;
            color: var(--accent);
            font-family: var(--font-mono);
        }

        .event-data {
            margin-top: var(--s3);
        }

        .event-detail {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .event-note {
            margin-top: var(--s2);
            padding: var(--s2) var(--s3);
            border-left: 2px solid var(--border);
            background: var(--bg-primary);
            border-radius: 0 4px 4px 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .event-note .note-label {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .event-note.is-critique { border-left-color: var(--accent); }
        .event-note.is-critique .note-label { color: var(--accent); }

        .flag {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .flag.is-positive { color: var(--positive); }
        .flag.is-negative { color: var(--negative); }
        .flag.is-accent   { color: var(--accent); }

        /* ---- Distribution ---- */
        .dist {
            display: flex;
            align-items: center;
            gap: var(--s3);
        }

        .dist-track {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .dist-fill {
            height: 6px;
            border-radius: 3px;
            background: var(--accent);
        }

        /* ---- Pagination ---- */
        .pagination {
            display: flex;
            gap: var(--s2);
            align-items: center;
            justify-content: center;
            margin-top: var(--s5);
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            padding: var(--s6) var(--s4);
            color: var(--text-secondary);
            font-size: 13px;
        }

        .empty-state .empty-title {
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: var(--s1);
        }

        /* ---- Utility ---- */
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 320px;
        }

        .flex { display: flex; }
        .gap-2 { gap: var(--s2); }
        .gap-3 { gap: var(--s3); }
        .gap-4 { gap: var(--s4); }
        .items-center { align-items: center; }
        .items-baseline { align-items: baseline; }
        .justify-between { justify-content: space-between; }
        .mb-2 { margin-bottom: var(--s2); }
        .mb-3 { margin-bottom: var(--s3); }
        .mb-4 { margin-bottom: var(--s4); }
        .mb-5 { margin-bottom: var(--s5); }
        .mt-4 { margin-top: var(--s4); }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--s5);
        }

        .run-header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: var(--s5);
            align-items: start;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: var(--s2);
        }

        .meta-key { width: 140px; }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .page-body { padding: var(--s4); }
            .page-header { padding: var(--s4); }
            .grid-2 { grid-template-columns: 1fr; }
            .stat {
                border-right: none;
                padding-right: 0;
                margin-right: 0;
                width: 50%;
                margin-bottom: var(--s3);
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        {% set path = request.url.path %}
        <div class="sidebar-header">
            <h1>Datalake</h1>
            <div class="subtitle">Agent reasoning traces</div>
        </div>
        <div class="sidebar-nav">
            <a href="/" class="{% if path == '/' %}active{% endif %}">Overview</a>
            <a href="/sessions" class="{% if path.startswith('/sessions') %}active{% endif %}">Traces</a>
            <a href="/stats" class="{% if path == '/stats' %}active{% endif %}">Statistics</a>
            <a href="/compare" class="{% if path == '/compare' %}active{% endif %}">Compare</a>
        </div>
        <div class="sidebar-footer">
            Oracle 26ai Free<br>
            v{{ version | default("0.1.0") }}
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h2>{{ page_title | default("Reasoning Datalake") }}</h2>
        </div>
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
